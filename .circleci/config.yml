version: 2.1

commands:
  run-tox:
    description: "Run tox"
    parameters:
      version:
        type: string
      sphinx-version:
        type: string
        default: "5,6,7,8,9,latest,dev"
    steps:
      - checkout
      - run: pip install --user tox
      - run: tox -e "<<parameters.version>>-sphinx{<<parameters.sphinx-version>>}"

jobs:
  py311:
    docker:
      - image: 'cimg/python:3.11'
    steps:
      - run-tox:
          version: py311
          sphinx-version: "5,6,7,8,9"
  py312:
    docker:
      - image: 'cimg/python:3.12'
    steps:
      - run-tox:
          version: py312
          sphinx-version: "7,8,9"
  py313:
    docker:
      - image: 'cimg/python:3.13'
    steps:
      - run-tox:
          version: py313
          sphinx-version: "8,9"
  py314:
    docker:
      - image: 'cimg/python:3.14'
    steps:
      - run-tox:
          version: py314
          sphinx-version: "8,9"
  py315:
    docker:
      - image: 'cimg/python:3.15'
    steps:
      - run-tox:
          version: py315
          sphinx-version: "8,9"
  docs:
    docker:
      - image: 'cimg/python:3.12'
    steps:
      - checkout
      - run: pip install --user tox
      - run: tox -e docs

workflows:
  version: 2
  tests:
    jobs:
      - docs
      - py315
      - py314
      - py313
      - py312
      - py311
